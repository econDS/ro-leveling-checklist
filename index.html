<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RO Item Visual Checklist</title>
  <style>
    :root{
      --bg:#f4f6f8;--panel:#fff;--text:#1f252d;--muted:#66727f;--line:#d8dee7;
      --ink:#17212d;--accent:#0f7b72;--warn:#8a5600;--danger:#a83232;--ok:#147a42;
      --chip:#eef3f6;--soft:#f8fafc;--practice:#315b9a;--race:#9a3d31;
      font-family:"Segoe UI",Tahoma,sans-serif
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);line-height:1.45}
    header{background:var(--ink);color:#fff;padding:18px 22px 12px}
    h1{margin:0 0 4px;font-size:24px;letter-spacing:0}
    header p{margin:0;color:#c9d3df;font-size:14px}
    main{max-width:1480px;margin:0 auto;padding:16px 18px 28px}
    .toolbar{display:grid;grid-template-columns:minmax(220px,1fr) auto auto auto;gap:10px;align-items:center;margin-bottom:12px}
    .search,.select{height:38px;border:1px solid #c8d0dc;border-radius:6px;background:#fff;color:var(--text);padding:7px 10px;font-size:14px}
    .tabs,.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    button{height:38px;border:1px solid #c8d0dc;border-radius:6px;background:#fff;color:var(--text);padding:0 12px;font-weight:700;cursor:pointer}
    button:hover{border-color:#8da0b6}
    button.active{background:var(--accent);border-color:var(--accent);color:#fff}
    button.icon{width:38px;padding:0;font-size:18px}
    .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
    .metric{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 12px;box-shadow:0 8px 20px rgba(28,38,52,.06)}
    .metric .label{font-size:12px;color:var(--muted);font-weight:800}
    .metric .value{font-size:23px;font-weight:900;color:var(--accent);margin-top:2px}
    .metric .sub{font-size:12px;color:var(--muted)}
    .layout{display:grid;grid-template-columns:240px 1fr;gap:12px;align-items:start}
    aside{position:sticky;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;box-shadow:0 8px 20px rgba(28,38,52,.06)}
    .side-title{margin:0 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase}
    .phase-btn{width:100%;justify-content:space-between;text-align:left;margin:0 0 6px;display:flex;align-items:center;gap:8px}
    .phase-count{font-size:12px;color:var(--muted);font-weight:700}
    .phase-btn.active .phase-count{color:#dff8f4}
    .note{font-size:12px;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:9px;margin-top:10px}
    section{display:grid;gap:12px}
    .group{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:visible;box-shadow:0 8px 20px rgba(28,38,52,.06)}
    .group-head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 13px;background:#eef3f6;border-bottom:1px solid var(--line)}
    .group-title{margin:0;font-size:15px}
    .group-sub{font-size:12px;color:var(--muted)}
    .group-summary{padding:7px 13px;border-bottom:1px solid var(--line);background:#f8fafc;color:#405061;font-size:12px;font-weight:750}
    .group-toggle{height:30px;padding:0 10px;font-size:12px;white-space:nowrap}
    .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0;border-top:0}
    .item{position:relative;min-height:86px;display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:start;padding:12px;border-right:1px solid #edf0f4;border-bottom:1px solid #edf0f4;background:#fff}
    .item:hover,.item:focus-within{z-index:20}
    .item.done{background:#f1faf5}
    .item.physical{background:#fff1f1}
    .item.physical.done{background:#f6e7e7}
    .item.magical{background:#eef6ff}
    .item.magical.done{background:#e4f0eb}
    .check{width:22px;height:22px;margin-top:7px;accent-color:var(--accent)}
    .item-main{min-width:0}
    .item-head{display:flex;align-items:flex-start;gap:8px;margin:0 0 4px}
    .iconbox{width:38px;height:38px;border:1px solid #cdd5df;border-radius:6px;background:#f7f9fb;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .iconbox img{width:24px;height:24px;image-rendering:pixelated}
    .iconflow{display:flex;align-items:center;gap:4px}
    .arrow{font-size:15px;line-height:1;color:#6f7b87;font-weight:900}
    .missing-icon{font-size:10px;color:var(--muted);font-weight:800}
    .name{font-size:14px;font-weight:850;line-height:1.25;margin:0;min-width:0}
    .meta{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 5px}
    .tag{display:inline-flex;align-items:center;border-radius:999px;background:var(--chip);color:#405061;padding:2px 7px;font-size:11px;font-weight:750}
    .tag.practice{background:#eaf1fb;color:var(--practice)}
    .tag.race{background:#f9ece9;color:var(--race)}
    .tag.required{background:#e9f7ef;color:var(--ok)}
    .tag.warn{background:#fff4db;color:var(--warn)}
    .tag.missing{background:#fdecec;color:var(--danger)}
    .desc{font-size:12px;color:var(--muted);margin:0}
    .hover-detail{display:none}
    .choice-options{display:grid;gap:6px;margin-top:8px}
    .choice-option{display:grid;grid-template-columns:18px minmax(0,1fr);gap:7px;align-items:start;border:1px solid var(--line);border-radius:6px;background:var(--soft);padding:7px}
    .choice-option input{width:16px;height:16px;margin:1px 0 0;accent-color:var(--accent)}
    .choice-title{font-size:12px;font-weight:900;color:var(--text)}
    .choice-desc{font-size:11px;color:var(--muted);margin-top:1px}
    .qty{font-weight:900;color:#243447}
    .empty{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:24px;color:var(--muted);text-align:center}
    .gate{position:fixed;inset:0;z-index:1000;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;padding:20px}
    .gate.hidden{display:none}
    .gate-panel{width:min(380px,100%);background:#fff;color:var(--text);border-radius:8px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
    .gate-title{margin:0 0 12px;font-size:20px}
    .gate-form{display:grid;gap:10px}
    .gate-input{height:42px;border:1px solid #c8d0dc;border-radius:6px;padding:8px 10px;font-size:16px}
    .gate-error{min-height:18px;color:var(--danger);font-size:13px;font-weight:700}
    body.compact .items{grid-template-columns:repeat(auto-fill,minmax(172px,1fr))}
    body.compact .item{min-height:58px;grid-template-columns:22px minmax(0,1fr);gap:7px;align-items:start;padding:9px;cursor:help}
    body.compact .item:focus{outline:2px solid rgba(15,123,114,.35);outline-offset:-2px}
    body.compact .check{display:block;width:18px;height:18px;margin:0}
    body.compact .meta,body.compact .desc{display:none}
    body.compact .choice-options{display:none}
    body.compact .name{margin:0;font-size:13px}
    body.compact .item-head{align-items:flex-start;margin:0}
    body.compact .iconflow{align-items:flex-start}
    body.compact .iconflow .arrow{align-self:center}
    body.compact .item:hover .hover-detail,body.compact .item:focus-within .hover-detail{display:block;position:absolute;left:8px;right:8px;top:calc(100% - 4px);z-index:30;background:#fff;border:1px solid #bec8d5;border-radius:8px;box-shadow:0 14px 34px rgba(23,33,45,.22);padding:10px;min-width:260px}
    body.compact .item.tooltip-up:hover .hover-detail,body.compact .item.tooltip-up:focus-within .hover-detail{top:auto;bottom:calc(100% - 4px)}
    body.compact .hover-detail .meta{display:flex;margin:0 0 7px}
    body.compact .hover-detail .desc{display:block;color:var(--text);font-size:12px}
    body.compact .hover-detail .choice-options{display:grid}
    body.compact .group-head{padding:8px 10px}
    body.compact .group.expanded .items{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
    body.compact .group.expanded .item{min-height:86px;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:start;padding:12px}
    body.compact .group.expanded .check{display:block}
    body.compact .group.expanded .meta{display:flex}
    body.compact .group.expanded .desc{display:block}
    body.compact .group.expanded .name{margin:0 0 4px;font-size:14px}
    body.compact .group.expanded .item-head{margin:0 0 4px}
    body.compact .group.expanded .hover-detail{display:none}
    body.compact .group.expanded .choice-options{display:grid}
    @media(max-width:900px){.toolbar{grid-template-columns:1fr}.layout{grid-template-columns:1fr}aside{position:static}.stats{grid-template-columns:1fr 1fr}}
    @media(max-width:560px){main{padding:12px}.items{grid-template-columns:1fr}.stats{grid-template-columns:1fr}h1{font-size:20px}}
  </style>
</head>
<body class="compact">
  <div id="gate" class="gate">
    <div class="gate-panel">
      <h2 class="gate-title">ใส่รหัสผ่าน</h2>
      <form id="gateForm" class="gate-form">
        <input id="gatePassword" class="gate-input" type="password" autocomplete="current-password" autofocus>
        <button type="submit">เข้าใช้งาน</button>
        <div id="gateError" class="gate-error" aria-live="polite"></div>
      </form>
    </div>
  </div>
  <header>
    <h1>Item Visual Checklist</h1>
    <p>เตรียมของสำหรับ Reginleif 260 แยกตอนซ้อม vs ตอนแข่งจริง</p>
  </header>
  <main>
    <div class="toolbar">
      <input id="search" class="search" type="search" placeholder="ค้นหาไอเท็ม, หมวด, หมายเหตุ เช่น All In One, วิง, EXP, แข่ง">
      <div class="tabs" role="tablist">
        <button data-mode="practice">ตอนซ้อม</button>
        <button data-mode="race" class="active">ตอนแข่ง</button>
      </div>
      <select id="priority" class="select" aria-label="กรองสถานะ">
        <option value="all">ทุกสถานะ</option>
        <option value="required">ต้องมี</option>
        <option value="optional">ทางเลือก / แผนสำรอง</option>
        <option value="ยืนยัน">ต้องยืนยัน</option>
      </select>
      <div class="actions">
        <button id="compactToggle" class="active" title="ย่อ/ขยายรายการ">ขยาย</button>
        <button id="showOpen" title="แสดงเฉพาะไอเท็มที่ยังไม่ครบ">เหลือเฉพาะไอเท็มที่ยังไม่ครบ</button>
        <button id="reset" class="icon" title="ล้างรายการที่เช็กแล้ว">↺</button>
      </div>
    </div>

    <div id="stats" class="stats"></div>

    <div class="layout">
      <aside>
        <h2 class="side-title">หมวด</h2>
        <div id="phaseNav"></div>
        <div class="note">
          รายการที่เช็กแล้วจะจำไว้ใน browser เครื่องนี้ เหมาะสำหรับเปิดจอแชร์ Discord แล้วไล่เช็กของจริงทีละคน
        </div>
      </aside>
      <section id="content"></section>
    </div>
  </main>

    }

      if (localStorage.getItem(gateKey) === "1") {
        unlockGate();
        return;
      }
      $("gateForm").addEventListener("submit", event => {
        event.preventDefault();
        if ($("gatePassword").value.trim() === "เกาหลี") {
          unlockGate();
        } else {
          $("gateError").textContent = "รหัสผ่านไม่ถูกต้อง";

    ];

      ["account","วันเปิด server ก่อนแข่ง"],
      ["damage","Damage / Survival Buff"],
      ["utility","Utility / Rescue"],
      ["exp","EXP Buff"],
      ["booster","Booster / ของตามเส้นทาง"]
    ];
    let mode = "race", phase = "all", openOnly = false, compact = true;
    const expandedGroups = new Set();
    const stateKey = "ro-item-visual-checklist-v1";
    const checked = JSON.parse(localStorage.getItem(stateKey) || "{}");
    if (!checked["premium-silvervine-choice"]) {
      const legacyPremium = {};
      if (checked["silvervine-premium-all"]) legacyPremium.all = true;
      if (!legacyPremium.all) {
        if (checked["silvervine-premium-exp"]) legacyPremium.exp = true;
        if (checked["silvervine-premium-drop"]) legacyPremium.drop = true;
        if (checked["silvervine-death"]) legacyPremium.death = true;
      }
      if (Object.keys(legacyPremium).length) checked["premium-silvervine-choice"] = legacyPremium;
    }
    const $ = id => document.getElementById(id);
    function choiceState(item){ return checked[item.id] && typeof checked[item.id] === "object" ? checked[item.id] : {}; }
    function itemDone(item){
      if (!item.choiceOptions) return Boolean(checked[item.id]);
      if (item.id === "premium-silvervine-choice") {
        const state = choiceState(item);
        return Boolean(state.all || state.exp);
      }
      return item.choiceOptions.some(option => choiceState(item)[option.id]);
    }
    function formatEa(min, max){
      if (!min && !max) return "";
      return min === max ? `${min} ea` : `${min}-${max} ea`;
    }
    function premiumSilvervineSummary(item){
      if (item.id !== "premium-silvervine-choice") return null;
      const state = choiceState(item);
      if (state.all) return {requiredMin:6, requiredMax:6};
      const picked = item.choiceOptions.filter(option => option.id !== "all" && state[option.id]);
      const optional = picked.filter(option => option.id !== "exp").reduce((sum, option) => sum + (option.silvervineCost || 0), 0);
      const total = 4 + optional;
      return {requiredMin:total, requiredMax:total};
    }
    function silvervineSummary(list){
      let requiredMin = 0, requiredMax = 0, optionalMin = 0, optionalMax = 0;
      const notes = [];
      let checkedMin = 0, checkedMax = 0;
      list.forEach(item => {
        const premium = premiumSilvervineSummary(item);
        if (premium) {
          if (premium.requiredMin) {
            requiredMin += premium.requiredMin;
            requiredMax += premium.requiredMax;
            if (itemDone(item)) {
              checkedMin += premium.requiredMin;
              checkedMax += premium.requiredMax;
            }
          }
          if (premium.note) notes.push(premium.note);
          return;
        }
        if (item.id === "silvervine-class4") return;
        if (!item.silvervineCost) return;
        const itemRequiredMin = item.silvervineCost.requiredMin || 0;
        const itemRequiredMax = item.silvervineCost.requiredMax || item.silvervineCost.requiredMin || 0;
        requiredMin += itemRequiredMin;
        requiredMax += itemRequiredMax;
        if (itemDone(item)) {
          checkedMin += itemRequiredMin;
          checkedMax += itemRequiredMax;
        }
        optionalMin += item.silvervineCost.optionalMin || 0;
        optionalMax += item.silvervineCost.optionalMax || item.silvervineCost.optionalMin || 0;
      });
      const parts = [];
      if (requiredMin || requiredMax) parts.push(`Silvervine เช็กแล้ว ${formatEa(checkedMin, checkedMax)} / ${formatEa(requiredMin, requiredMax)}`);
      if (optionalMin || optionalMax) parts.push(`ทางเลือก +${formatEa(optionalMin, optionalMax)}`);
      if (notes.length) parts.push(notes.join(", "));
      if (list.some(item => item.id === "silvervine-class4")) parts.push("ไม่รวม Class 4 100 ea");
      return parts.length ? parts.join(" | ") : "";
    }
    function save(){ localStorage.setItem(stateKey, JSON.stringify(checked)); }
    function itemVisible(item){
      const text = ($("search").value || "").trim().toLowerCase();
      const pri = $("priority").value;
      const choices = item.choiceOptions ? item.choiceOptions.flatMap(option => [option.label, option.desc]) : [];
      const blob = [item.name,item.phase,item.priority,item.qty,item.desc,...item.tags,...choices,item.use.join(" ")].join(" ").toLowerCase();
      if (mode !== "all" && mode !== "missing" && !item.use.includes(mode)) return false;
      if (mode === "missing" && item.img) return false;
      if (phase !== "all" && item.phase !== phase) return false;
      if (pri !== "all" && item.priority !== pri) return false;
      if (openOnly && itemDone(item)) return false;
      if (text && !blob.includes(text)) return false;
      return true;
    }
    function phaseLabel(id){ return phases.find(p => p[0] === id)?.[1] || id; }
    function renderStats(visible){
      const total = visible.length;
      const done = visible.filter(itemDone).length;
      const required = visible.filter(i => i.priority === "required").length;
      const pct = total ? Math.round(done / total * 100) : 0;
      $("stats").innerHTML = [
        ["เช็คของที่มี", `${done}/${total}`, `เช็กแล้ว ${pct}%`],
        ["ต้องมี", required, "ของที่ควรมีพร้อมก่อนออกตัว"],
        ["โหมด", mode === "practice" ? "ตอนซ้อม" : "ตอนแข่ง", phase === "all" ? "ทุกหมวด" : phaseLabel(phase)]
      ].map(([label,value,sub]) => `<div class="metric"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`).join("");
    }
    function renderPhaseNav(){
      const buttons = [["all","ทุกหมวด"], ...phases];
      $("phaseNav").innerHTML = buttons.map(([id,label]) => {
        const count = items.filter(i => (id === "all" || i.phase === id) && itemVisible({...i, phase:i.phase})).length;
        return `<button class="phase-btn ${phase === id ? "active" : ""}" data-phase="${id}"><span>${label}</span><span class="phase-count">${count}</span></button>`;
      }).join("");
      document.querySelectorAll("[data-phase]").forEach(btn => btn.addEventListener("click", () => { phase = btn.dataset.phase; render(); }));
    }
    function itemClass(item){
      return ["item", itemDone(item) ? "done" : "", item.phase === "damage" && item.damageClass ? item.damageClass : ""].filter(Boolean).join(" ");
    }
    function renderItem(item){
      const done = itemDone(item);
      const tags = [
        ...item.use.map(u => `<span class="tag ${u}">${u === "practice" ? "ซ้อม" : "แข่ง"}</span>`),
        `<span class="tag ${item.priority === "required" ? "required" : item.priority === "ยืนยัน" ? "warn" : ""}">${item.priority === "required" ? "ต้องมี" : item.priority === "optional" ? "ทางเลือก" : item.priority}</span>`,
        ...item.tags.map(t => `<span class="tag ${t.includes("missing") ? "missing" : t.includes("รูปแทนชั่วคราว") ? "warn" : ""}">${t}</span>`)
      ].join("");
      const options = item.choiceOptions ? `<div class="choice-options">${item.choiceOptions.map(option => `
        <label class="choice-option">
          <input class="choice-check" type="checkbox" data-choice-parent="${item.id}" data-choice-id="${option.id}" ${choiceState(item)[option.id] ? "checked" : ""}>
          <span><span class="choice-title">${option.label}</span><span class="choice-desc">${option.desc}</span></span>
        </label>`).join("")}</div>` : "";
      const firstIcon = item.img ? `<div class="iconbox"><img src="${asset}${item.img}" alt=""></div>` : `<div class="iconbox"><span class="missing-icon">NO ID</span></div>`;
      const secondIcon = item.img2 ? `<span class="arrow">›</span><div class="iconbox"><img src="${asset}${item.img2}" alt=""></div>` : "";
      const icon = `<div class="iconflow">${firstIcon}${secondIcon}</div>`;
      return `<article class="${itemClass(item)}" tabindex="0">
        <input class="check" type="checkbox" data-id="${item.id}" ${done ? "checked" : ""} aria-label="${item.name}">
        <div class="item-main">
          <div class="item-head">
            ${icon}
            <h3 class="name">${item.name}</h3>
          </div>
          <div class="meta"><span class="tag">${phaseLabel(item.phase)}</span><span class="tag qty">${item.qty}</span>${tags}</div>
          <p class="desc">${item.desc}</p>
          ${options}
          <div class="hover-detail">
            <div class="meta"><span class="tag">${phaseLabel(item.phase)}</span><span class="tag qty">${item.qty}</span>${tags}</div>
            <p class="desc">${item.desc}</p>
            ${options}
          </div>
        </div>
      </article>`;
    }
    function bindTooltips(){
      document.querySelectorAll(".item").forEach(card => {
        const placeTooltip = () => {
          card.classList.remove("tooltip-up");
          requestAnimationFrame(() => {
            const detail = card.querySelector(".hover-detail");
            if (!detail) return;
            const rect = detail.getBoundingClientRect();
            if (rect.bottom > window.innerHeight - 8) card.classList.add("tooltip-up");
          });
        };
        card.addEventListener("mouseenter", placeTooltip);
        card.addEventListener("focusin", placeTooltip);
      });
    }
    function render(){
      const visible = items.filter(itemVisible);
      renderStats(visible);
      renderPhaseNav();
      const damageOrder = {all:0, physical:1, magical:2};
      const orderedVisible = visible.map((item, index) => ({item, index})).sort((a, b) => {
        if (a.item.phase === "damage" && b.item.phase === "damage") {
          return (damageOrder[a.item.damageClass || "all"] - damageOrder[b.item.damageClass || "all"]) || (a.index - b.index);
        }
        return a.index - b.index;
      }).map(entry => entry.item);
      const byPhase = phases.map(([id,label]) => [id,label,orderedVisible.filter(i => i.phase === id)]).filter(([, , list]) => list.length);
      $("content").innerHTML = byPhase.length ? byPhase.map(([id,label,list]) => {
        const done = list.filter(itemDone).length;
        const expanded = !compact || expandedGroups.has(id);
        const summary = silvervineSummary(list);
        return `<div class="group ${expanded ? "expanded" : ""}">
          <div class="group-head">
            <div><h2 class="group-title">${label}</h2><div class="group-sub">เช็กแล้ว ${done}/${list.length}</div></div>
            <button class="group-toggle ${expanded ? "" : "active"}" data-group-toggle="${id}">${expanded ? "ย่อ" : "ขยาย"}</button>
          </div>
          ${summary ? `<div class="group-summary">${summary}</div>` : ""}
          <div class="items">${list.map(renderItem).join("")}</div>
        </div>`;
      }).join("") : `<div class="empty">ไม่พบไอเท็มตามตัวกรองตอนนี้</div>`;
      document.querySelectorAll("[data-group-toggle]").forEach(btn => btn.addEventListener("click", () => {
        const id = btn.dataset.groupToggle;
        if (!compact) {
          compact = true;
          phases.forEach(([phaseId]) => {
            if (phaseId !== id) expandedGroups.add(phaseId);
          });
          document.body.classList.add("compact");
          $("compactToggle").classList.add("active");
          $("compactToggle").textContent = "ขยาย";
        } else if (expandedGroups.has(id)) {
          expandedGroups.delete(id);
        } else {
          expandedGroups.add(id);
        }
        render();
      }));
      bindTooltips();
      document.querySelectorAll(".check").forEach(cb => cb.addEventListener("change", () => {
        const item = items.find(i => i.id === cb.dataset.id);
        if (item?.choiceOptions) {
          checked[item.id] = cb.checked ? {exp:true} : {};
        } else {
          checked[cb.dataset.id] = cb.checked;
        }
        save();
        render();
      }));
      document.querySelectorAll(".choice-check").forEach(cb => cb.addEventListener("change", event => {
        event.stopPropagation();
        const item = items.find(i => i.id === cb.dataset.choiceParent);
        if (!item) return;
        const state = {...choiceState(item)};
        if (cb.dataset.choiceId === "all") {
          checked[item.id] = cb.checked ? {all:true} : {};
        } else {
          if (cb.checked) {
            delete state.all;
            state[cb.dataset.choiceId] = true;
          } else {
            delete state[cb.dataset.choiceId];
          }
          checked[item.id] = state;
        }
        save();
        render();
      }));
    }
    document.querySelectorAll("[data-mode]").forEach(btn => btn.addEventListener("click", () => {
      mode = btn.dataset.mode;
      document.querySelectorAll("[data-mode]").forEach(b => b.classList.toggle("active", b === btn));
      render();
    }));
    $("search").addEventListener("input", render);
    $("priority").addEventListener("change", render);
    $("showOpen").addEventListener("click", () => {
      openOnly = !openOnly;
      $("showOpen").classList.toggle("active", openOnly);
      render();
    });
    $("compactToggle").addEventListener("click", () => {
      compact = !compact;
      expandedGroups.clear();
      document.body.classList.toggle("compact", compact);
      $("compactToggle").classList.toggle("active", compact);
      $("compactToggle").textContent = compact ? "ขยาย" : "ย่อ";
      render();
    });
    $("reset").addEventListener("click", () => {
      if (!confirm("ล้าง checkbox ทั้งหมดในหน้านี้?")) return;
      Object.keys(checked).forEach(k => delete checked[k]);
      save();
      render();
    });
    initGate();
    render();
  </script>
</body>
</html>
